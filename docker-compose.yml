version: '3.8'

services:
  # PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aidbid-postgres
    environment:
      POSTGRES_DB: aidbid
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidbid-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: aidbid-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidbid-network

  # Gateway Service
  gateway:
    build:
      context: .
      dockerfile: ai-bid-gateway/Dockerfile
    container_name: aidbid-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-docker}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aidbid-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: ai-bid-user/Dockerfile
    container_name: aidbid-user
    ports:
      - "${USER_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-docker}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=aidbid
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aidbid-network

  # Project Service
  project-service:
    build:
      context: .
      dockerfile: ai-bid-project/Dockerfile
    container_name: aidbid-project
    ports:
      - "${PROJECT_PORT:-8082}:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-docker}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=aidbid
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aidbid-network

  # Material Service
  material-service:
    build:
      context: .
      dockerfile: ai-bid-material/Dockerfile
    container_name: aidbid-material
    ports:
      - "${MATERIAL_PORT:-8083}:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-docker}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=aidbid
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aidbid-network

  # Document Service
  document-service:
    build:
      context: .
      dockerfile: ai-bid-document/Dockerfile
    container_name: aidbid-document
    ports:
      - "${DOCUMENT_PORT:-8084}:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-docker}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=aidbid
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aidbid-network

networks:
  aidbid-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
