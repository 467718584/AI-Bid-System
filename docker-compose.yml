version: '3.8'

services:
  # Knowledge Service (Python)
  knowledge-service:
    build:
      context: ./ai-bid-knowledge
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    networks:
      - bid-network

  # AI Service (Python)
  ai-service:
    build:
      context: ./ai-bid-ai
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
    networks:
      - bid-network

networks:
  bid-network:
    driver: bridge
