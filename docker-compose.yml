version: '3.8'

services:
  # Gateway - 路由服务
  gateway:
    build: ./ai-bid-gateway
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - user-service
      - project-service
      - bid-service
    networks:
      - bid-network

  # User Service
  user-service:
    build: ./ai-bid-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - bid-network

  # Project Service
  project-service:
    build: ./ai-bid-project
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - bid-network

  # Material Service
  material-service:
    build: ./ai-bid-material
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - bid-network

  # Document Service
  document-service:
    build: ./ai-bid-document
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - bid-network

  # Bid Service
  bid-service:
    build: ./ai-bid-bid
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - bid-network

  # Knowledge Service (Python)
  knowledge-service:
    build:
      context: ./ai-bid-knowledge
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    networks:
      - bid-network

  # AI Service (Python)
  ai-service:
    build:
      context: ./ai-bid-ai
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
    networks:
      - bid-network

  # Enterprise Service
  enterprise-service:
    build: ./ai-bid-enterprise
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - bid-network

  # Frontend (Node)
  frontend:
    build:
      context: ./ai-bid-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - bid-network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_bid
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bid-network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - bid-network

networks:
  bid-network:
    driver: bridge

volumes:
  postgres_data: