camunda.bpm:
  # 基础配置
  id-generator: fixed
  # 禁用默认表单生成（避免不必要的依赖）
  generic-properties:
    properties:
      defaultNumberFormat: java.math.BigDecimal
  # 自动部署 BPMN 文件
  auto-deployment:
    enabled: true
    resources:
      - classpath:bpmn/*.bpmn
  # 数据库配置
  database:
    schema: camunda
  # 历史级别
  history-level: full

# 允许Bean覆盖（Camunda需要的配置）
spring.main.allow-bean-definition-overriding: true

server:
  port: 8082

spring:
  application:
    name: ai-bid-project

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aidbid}?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.aibid.project.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO

# AI服务配置
ai:
  service:
    url: http://ai:8087
