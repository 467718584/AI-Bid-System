server:
  port: 8090

spring:
  main:
    web-application-type: reactive
  application:
    name: ai-bid-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # AI服务 (Python) - 使用Docker服务名
        - id: ai-service
          uri: http://ai-bid-ai:8087
          predicates:
            - Path=/api/ai/**
        # 知识库服务 (Python) - 使用Docker服务名
        - id: knowledge-service
          uri: http://ai-bid-knowledge:8086
          predicates:
            - Path=/api/knowledge/**
        # 用户服务 (Java) - 使用Docker服务名
        - id: user-service
          uri: http://ai-bid-user:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        # 项目服务 (Java) - 使用Docker服务名
        - id: project-service
          uri: http://ai-bid-project:8082
          predicates:
            - Path=/api/project/**
          filters:
            - StripPrefix=1
        # 物料服务 (Java) - 使用Docker服务名
        - id: material-service
          uri: http://ai-bid-material:8083
          predicates:
            - Path=/api/material/**
          filters:
            - StripPrefix=1
        # 文档服务 (Java) - 使用Docker服务名
        - id: document-service
          uri: http://ai-bid-document:8084
          predicates:
            - Path=/api/document/**
          filters:
            - StripPrefix=1
        # 标书服务 (Java) - 使用Docker服务名
        - id: bid-service
          uri: http://ai-bid-bid:8085
          predicates:
            - Path=/api/bid/**
          filters:
            - StripPrefix=1
        # 标书服务 (Java) - /bid/** -> http://ai-bid-bid:8085/bid/** (兼容前端)
        - id: bid-service-alt
          uri: http://ai-bid-bid:8085
          predicates:
            - Path=/bid/**
          filters:
            - StripPrefix=1
        # 工作流服务 (Java) - 使用Docker服务名
        - id: workflow-service
          uri: http://ai-bid-bid:8085
          predicates:
            - Path=/api/workflow/**
          filters:
            - StripPrefix=1
        # 企业服务 (Java) - 使用Docker服务名
        - id: enterprise-service
          uri: http://ai-bid-bid:8085
          predicates:
            - Path=/api/enterprise/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
