server:
  port: 8080

spring:
  application:
    name: ai-bid-gateway

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aidbid}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  mybatis-plus:
    mapper-locations: classpath*:mapper/**/*.xml
    type-aliases-package: com.aibid.gateway.entity
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 用户服务
        - id: ai-bid-user
          uri: lb://ai-bid-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        # 项目服务
        - id: ai-bid-project
          uri: lb://ai-bid-project
          predicates:
            - Path=/api/project/**
          filters:
            - StripPrefix=1
        # 材料服务
        - id: ai-bid-material
          uri: lb://ai-bid-material
          predicates:
            - Path=/api/material/**
          filters:
            - StripPrefix=1
        # 文档服务
        - id: ai-bid-document
          uri: lb://ai-bid-document
          predicates:
            - Path=/api/document/**
          filters:
            - StripPrefix=1

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
