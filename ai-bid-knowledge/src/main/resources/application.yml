server:
  host: 0.0.0.0
  port: 8086

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# LLM配置
llm:
  provider: ${LLM_PROVIDER:minimax}
  minimax:
    api_key: ${MINIMAX_API_KEY:}
    base_url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
    model: ${MINIMAX_MODEL:abab6-chat}
  deepseek:
    api_key: ${DEEPSEEK_API_KEY:}
    base_url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  qwen:
    api_key: ${QWEN_API_KEY:}
    base_url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    model: ${QWEN_MODEL:qwen-turbo}

# 向量数据库配置
vector:
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8000}

# Embedding模型配置
embedding:
  model: ${EMBEDDING_MODEL:shibing624/text2vec-base-chinese}
  device: ${EMBEDDING_DEVICE:cpu}