server:
  port: 8085

spring:
  application:
    name: ai-bid-bid
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_bid
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aidbid.bid.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
